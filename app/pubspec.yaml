name: reading_tracker
description: 个人阅读管理 App — 多平台书架导入、本地优先存储、AI 阅读分析
publish_to: 'none'
version: 1.0.0+21

environment:
  sdk: '>=3.5.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # 国际化（en / zh-Hans）。运行 flutter gen-l10n 生成 lib/l10n/app_localizations.dart
  flutter_localizations:
    sdk: flutter

  # 本地存储（本地优先架构，无账号也能用）
  sqflite: ^2.3.3
  # 2.3.5+ 起要求 Dart SDK >=3.7.0，而 Flutter 3.24.5 自带 Dart 3.5.4，
  # 锁在 2.3.4+4 以兼容旧 SDK；若本机 Flutter 较新可放宽为 ^2.3.6
  sqflite_common_ffi: '2.3.4+4'
  path: ^1.9.0
  path_provider: ^2.1.4
  shared_preferences: ^2.3.3

  # 敏感凭据（微信读书 Key / 大模型 Key）存系统密钥库，不写明文 SQLite
  flutter_secure_storage: ^9.2.0

  # 导入能力
  image_picker: ^1.1.2
  google_mlkit_text_recognition: ^0.13.0   # 端侧 OCR，离线、免费、中英文
  # OCR 前的图像增强（放大 / 灰度 / 提对比）。纯 Dart，无平台通道
  image: ^4.2.0
  csv: ^6.0.0
  file_picker: ^9.0.0

  # 网络与 AI
  dio: ^5.7.0

  # UI
  flutter_riverpod: ^2.6.1
  # intl 由 flutter_localizations 间接锁定，且不同 Flutter 版本锁的版本不同：
  #   3.24.5（本机 WSL）→ intl 0.19.0
  #   >=3.29（Codemagic stable）→ intl 0.20.2
  # 写成 `^0.20.2` 会让 pub 在 3.24.5 上直接解析失败（version solving failed），
  # 而写死 `^0.19.0` 又会在新版 SDK 上失败。用区间兼容两端。
  intl: '>=0.19.0 <0.21.0'
  fl_chart: ^0.69.2
  cached_network_image: ^3.3.1

  # 阅读画像「生成分享图片」：离屏渲染成 PNG + 调起系统分享
  screenshot: ^3.0.0
  share_plus: ^10.1.2
  # 「保存图片到本地相册」。share_plus 只能把图交给别的 App，
  # 用户想要「攒下来」时没有出口——这两件事不能互相替代。
  # gal 2.3.3 的约束是 sdk >=3.0.0 / flutter >=3.7.0，与 3.24.5 兼容。
  gal: ^2.3.3
  # 打赏页：从「设置 → 支持开发者」调起外部浏览器打开用户自填链接
  url_launcher: ^6.3.1

  # 阅读计划提醒：本地通知（无需推送服务，不依赖任何后端）
  flutter_local_notifications: ^17.2.3
  # zonedSchedule 需要时区类型；latest_all 含完整时区数据
  timezone: ^0.9.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  # 打开 gen-l10n 代码生成：flutter pub get / build 时会依据 l10n.yaml
  # 自动生成 lib/l10n/app_localizations.dart（含 S 类）。缺这一行则
  # 必须每次手动执行 `flutter gen-l10n`，否则 import 会解析失败。
  generate: true
  assets:
    # 首批示例书库（38 本合成数据，分类与简介覆盖率 100%）
    # 首次启动自动灌库，让用户打开即见形态完整的书架而非空列表
    - assets/seed/library.json
    - assets/seed/library.en.json
    # 背景贴图皮肤资源（6 张 WebP，共约 90KB）。
    # 刻意不给整个 assets/ 目录：那样会把 seed 下的种子书库也
    # 当成可寻址资源打进 AssetManifest，白占索引。
    - assets/backgrounds/
