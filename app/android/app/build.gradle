plugins {
    id "com.android.application"
    id "kotlin-android"
    // The Flutter Gradle Plugin must be applied after the Android and Kotlin Gradle plugins.
    id "dev.flutter.flutter-gradle-plugin"
}

// 从 android/key.properties 读取正式签名（详见 key.properties.example）
def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file('key.properties')
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

android {
    // 已定稿：产品名 Readnest，个人开发者反向域名（GitHub 路径，无需买域名）
    namespace = "io.github.ltong9463.readnest"
    // Google Play 自 2026-08-31 起要求新应用 targetSdk >= 36（Android 16）
    compileSdk = 36
    ndkVersion = flutter.ndkVersion

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = JavaVersion.VERSION_17
    }

    defaultConfig {
        // 与 namespace 一致；上架后不可更改
        applicationId = "io.github.ltong9463.readnest"
        minSdk = 24
        targetSdk = 36
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties['keyAlias']
            keyPassword = keystoreProperties['keyPassword']
            storeFile = keystoreProperties['storeFile'] ? file(keystoreProperties['storeFile']) : null
            storePassword = keystoreProperties['storePassword']
        }
    }

    buildTypes {
        release {
            // 未配置 android/key.properties 时此 release 构建会失败——
            // 请先按 key.properties.example 用 keytool 生成 keystore 并填写。
            signingConfig = signingConfigs.release
            // 保留 release 包的符号信息（崩溃栈可读；正式上架可关闭）
            ndk { debugSymbolLevel = "SYMBOL_TABLE" }
            // ⚠️ minifyEnabled **必须显式写出**，不能依赖默认值。
            //
            // 2026-10-10 真机事故：这个 release 包实际是**开着压缩**的，
            // 尽管这里从未写过 `minifyEnabled true`（工具链默认值变了）。
            // 后果是 R8 把 Gson 的 `com.google.gson.reflect.TypeToken`
            // 改名成了 `v4.a`——连带把它的**泛型签名**一起吃掉，于是
            // flutter_local_notifications 在解析已排期的通知时抛
            //   IllegalStateException: TypeToken must be created with a type
            //   argument ... make sure that generic signatures are preserved
            // 而这个调用发生在 ScheduledNotificationBootReceiver.onReceive 里，
            // 属于 Android 组件入口，异常直接变成 FATAL EXCEPTION。
            //
            // 用户侧的表现正是「首次打开必闪退、第二次才正常」：进程在
            // Flutter 画出第一帧之前就被 SIG:9 杀掉（进程级崩溃，
            // Dart 的 try/catch 完全接不到），而触发它的广播是一次性的，
            // 第二次启动就不再投递，于是看起来"重开一次就好了"。
            //
            // 用之前的 dex 反查确认过那是全局压缩：`com.tekartik.sqflite`
            // 这类没有任何 keep 保护的第三方类同样被改名了。
            //
            // 这里显式关闭，让构建行为回到本文件原先设想的那样。
            // 将来若要开启压缩，**必须**先在 proguard-rules.pro 里保留
            // Gson 的泛型签名（那条规则已经写好了），并在真机回归
            // 通知 / OCR 导入 / 分享三条链路之后再打开。
            minifyEnabled false
            shrinkResources false
            debuggable false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    // 端侧中文 OCR 模型：google_mlkit_text_recognition 的 TextRecognizer
    // 在识别中文时需要它显式存在于 classpath，否则运行时才报错。
    // （拉丁模型由插件自带，无需声明。）
    implementation 'com.google.mlkit:text-recognition-chinese:16.0.1'
}

flutter {
    source = "../.."
}
